<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Here</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="login-box" aria-labelledby="panel-title">
    <h1 id="panel-title">Login Here</h1>
    <form id="auth-form">
      <div class="field">
        <label for="username">Username:</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required>
      </div>
      <div class="field">
        <label for="password">Password:</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="100" required>
      </div>
      <div class="field confirm-field hidden" id="confirm-field">
        <label for="confirm-password">Confirm:</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" maxlength="100">
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="submit-button" type="submit">Login</button>
        <span id="switch-text">Not yet a Member?</span>
        <a href="#" id="switch-link">Register</a>
      </div>
    </form>
  </main>
</body>
</html>
